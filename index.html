<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1915" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>家居庫存</title>
  <style>
    :root {
      --bg: #efe8dc;
      --bg-2: #e4d9c8;
      --ink: #1c1915;
      --muted: #6f675d;
      --card: #fffaf3;
      --shadow: 0 10px 28px rgba(48, 32, 12, 0.08);
      --ok: #2f6b4f;
      --bad: #b42318;
      --star: #e0a106;
      --safe-b: max(18px, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #f7efe3, transparent 55%),
        radial-gradient(800px 400px at 110% 0%, #eadcc6, transparent 50%),
        var(--bg);
      color: var(--ink);
    }
    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px calc(96px + var(--safe-b));
    }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .topbar-titles { flex: 1; min-width: 0; }
    .eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
    .icon-btn {
      width: 42px; height: 42px; border: 0; border-radius: 14px;
      background: rgba(255,250,243,0.75); color: var(--ink);
      display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow);
      position: relative;
    }
    .icon-btn .badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--star); color: #1c1915;
      font-size: 11px; font-weight: 800; display: grid; place-items: center;
    }
    .square-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cat-card {
      aspect-ratio: 1 / 1; border: 0; text-align: center; background: var(--card);
      border-radius: 26px; padding: 16px 12px; box-shadow: var(--shadow); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .cat-card:active { transform: scale(0.98); }
    .cat-icon {
      width: 72px; height: 72px; border-radius: 24px;
      display: grid; place-items: center; font-size: 36px;
    }
    .cat-card h3 { font-size: 26px; font-weight: 800; }
    .item-card {
      aspect-ratio: 1 / 1; background: var(--card); border-radius: 26px;
      padding: 12px 12px 12px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; min-width: 0; position: relative;
    }
    .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; padding-right: 36px; }
    .item-name {
      font-size: 18px; font-weight: 800; line-height: 1.2; text-align: left;
      border: 0; background: transparent; color: inherit; font-family: inherit; cursor: pointer;
    }
    .star-btn {
      position: absolute; top: 8px; right: 8px;
      width: 36px; height: 36px; border: 0; background: transparent;
      color: var(--muted); cursor: pointer; display: grid; place-items: center;
    }
    .star-btn.on { color: var(--star); }
    .star-btn svg { width: 26px; height: 26px; display: block; }
    .item-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .qty-num {
      font-size: clamp(52px, 18vw, 84px); font-weight: 800; letter-spacing: -0.07em;
      line-height: 0.9; font-variant-numeric: tabular-nums; color: var(--ok);
    }
    .qty-num.bad { color: var(--bad); }
    .item-sub { color: var(--muted); font-size: 12px; margin-top: 4px; font-weight: 600; }
    .qty-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .qty-btn {
      height: 48px; border: 0; border-radius: 16px; font-size: 28px; font-weight: 600;
      cursor: pointer; color: var(--ink); background: #efe6d6;
    }
    .qty-btn.plus { background: var(--ink); color: #fffaf3; }
    .empty { text-align: center; color: var(--muted); padding: 48px 12px; line-height: 1.7; }
    .fab {
      position: fixed; right: max(18px, calc(50vw - 360px + 18px));
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: 60px; height: 60px; border: 0; border-radius: 22px;
      background: var(--ink); color: #fffaf3; display: grid; place-items: center;
      box-shadow: 0 16px 30px rgba(28,25,21,0.28); cursor: pointer; z-index: 20;
    }
    .modal {
      position: fixed; inset: 0; background: rgba(28,25,21,0.38);
      display: grid; align-items: end; z-index: 30;
    }
    .sheet {
      background: #fffaf3; border-radius: 28px 28px 0 0;
      padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
      max-width: 720px; width: 100%; margin: 0 auto;
    }
    .sheet-handle { width: 44px; height: 5px; border-radius: 99px; background: #d8cbb8; margin: 6px auto 14px; }
    .sheet h3 { font-size: 22px; margin-bottom: 14px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    input, select {
      font: inherit; color: var(--ink); border: 1px solid rgba(28,25,21,0.08);
      background: #fff; border-radius: 14px; padding: 12px; font-size: 16px;
    }
    .sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .grow { flex: 1; }
    .btn { border: 0; border-radius: 14px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    .btn.primary { background: var(--ink); color: #fffaf3; }
    .btn.ghost { background: #efe6d6; color: var(--ink); }
    .btn.danger { color: var(--bad); background: #f8e4e1; }
    .hidden { display: none !important; }
    @media (min-width: 720px) {
      .square-grid { grid-template-columns: 1fr 1fr 1fr; }
      .modal { align-items: center; padding: 24px; }
      .sheet { border-radius: 28px; margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="返回">←</button>
      <div class="topbar-titles">
        <p class="eyebrow" id="eyebrow">六大種類</p>
        <h1 id="pageTitle">家居庫存</h1>
      </div>
      <button id="shopBtn" class="icon-btn" aria-label="待購清單">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <polygon points="12,3 15,9.5 22,10.2 17,15 18.4,22 12,18.6 5.6,22 7,15 2,10.2 9,9.5"/>
        </svg>
        <span id="shopBadge" class="badge hidden">0</span>
      </button>
    </header>

    <main id="homeView">
      <section class="square-grid" id="catGrid">
        <button class="cat-card" data-cat="food">
          <div class="cat-icon" style="background:#f3d7a4">🍚</div>
          <h3>食物</h3>
        </button>
        <button class="cat-card" data-cat="sauce">
          <div class="cat-icon" style="background:#f3c9a4">🫙</div>
          <h3>醬料</h3>
        </button>
        <button class="cat-card" data-cat="home">
          <div class="cat-icon" style="background:#cfe4f4">🏠</div>
          <h3>家品</h3>
        </button>
        <button class="cat-card" data-cat="body">
          <div class="cat-icon" style="background:#ddd4f0">🛁</div>
          <h3>身體</h3>
        </button>
        <button class="cat-card" data-cat="makeup">
          <div class="cat-icon" style="background:#f3d0d8">💄</div>
          <h3>化妝</h3>
        </button>
        <button class="cat-card" data-cat="other">
          <div class="cat-icon" style="background:#e4ddd3">📦</div>
          <h3>其他</h3>
        </button>
      </section>
    </main>

    <main id="listView" class="hidden">
      <section class="square-grid" id="itemList"></section>
      <p id="emptyHint" class="empty hidden">呢個分類暫時未有用品。<br/>撳右下角加一個大方格。</p>
    </main>

    <button id="addBtn" class="fab hidden" aria-label="新增">＋</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 id="modalTitle">新增用品</h3>
      <form id="itemForm">
        <label>名稱
          <input id="itemName" type="text" required maxlength="24" placeholder="例如：豉油" />
        </label>
        <label>大種類
          <select id="itemCat">
            <option value="food">食物</option>
            <option value="sauce">醬料</option>
            <option value="home">家品</option>
            <option value="body">身體</option>
            <option value="makeup">化妝</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label>數量
          <input id="itemQty" type="number" min="0" step="1" value="1" required />
        </label>
        <div class="sheet-actions">
          <button type="button" id="deleteBtn" class="btn ghost danger hidden">刪除</button>
          <div class="grow"></div>
          <button type="button" id="cancelBtn" class="btn ghost">取消</button>
          <button type="submit" class="btn primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      food: "食物", sauce: "醬料", home: "家品",
      body: "身體", makeup: "化妝", other: "其他"
    };
    const STORAGE_KEY = "home-inventory";
    const OLD_KEYS = ["home-inventory-v4", "home-inventory-v3", "home-inventory-v2", "home-inventory-v1"];
    const CAT_MAP = {
      food: "food", sauce: "sauce", home: "home",
      body: "body", makeup: "makeup", other: "other",
      hair: "body", oral: "body", face: "body"
    };
    const STAR_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><polygon points="12,3 15,9.5 22,10.2 17,15 18.4,22 12,18.6 5.6,22 7,15 2,10.2 9,9.5"/></svg>';
    const STAR_ON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><polygon points="12,3 15,9.5 22,10.2 17,15 18.4,22 12,18.6 5.6,22 7,15 2,10.2 9,9.5"/></svg>';

    const homeView = document.getElementById("homeView");
    const listView = document.getElementById("listView");
    const itemList = document.getElementById("itemList");
    const emptyHint = document.getElementById("emptyHint");
    const pageTitle = document.getElementById("pageTitle");
    const eyebrow = document.getElementById("eyebrow");
    const backBtn = document.getElementById("backBtn");
    const shopBtn = document.getElementById("shopBtn");
    const shopBadge = document.getElementById("shopBadge");
    const addBtn = document.getElementById("addBtn");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const form = document.getElementById("itemForm");
    const itemName = document.getElementById("itemName");
    const itemCat = document.getElementById("itemCat");
    const itemQty = document.getElementById("itemQty");
    const deleteBtn = document.getElementById("deleteBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let currentCat = null;
    let shoppingMode = false;
    let editingId = null;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function defaultItems() {
      return [
        { id: uid(), cat: "food", name: "米", qty: 1, wanted: false },
        { id: uid(), cat: "sauce", name: "豉油", qty: 1, wanted: false },
        { id: uid(), cat: "home", name: "洗衣液", qty: 1, wanted: false },
        { id: uid(), cat: "body", name: "沐浴露", qty: 2, wanted: false },
        { id: uid(), cat: "body", name: "洗髮露", qty: 1, wanted: false },
        { id: uid(), cat: "makeup", name: "卸妝", qty: 1, wanted: false },
        { id: uid(), cat: "other", name: "電池", qty: 4, wanted: false }
      ];
    }

    function normalizeItems(items) {
      if (!items || !items.length) return [];
      return items.map(function (it) {
        return {
          id: it.id || uid(),
          name: it.name || "未命名",
          cat: CAT_MAP[it.cat] || "other",
          qty: Math.max(0, Number(it.qty) || 0),
          wanted: !!it.wanted
        };
      });
    }

    function readKey(key) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        var items = normalizeItems(parsed && parsed.items);
        return items.length ? { items: items } : null;
      } catch (e) {
        return null;
      }
    }

    function loadState() {
      var current = readKey(STORAGE_KEY);
      if (current) return current;
      for (var i = 0; i < OLD_KEYS.length; i++) {
        var old = readKey(OLD_KEYS[i]);
        if (old) return old;
      }
      return { items: defaultItems() };
    }

    var state = loadState();

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    saveState();

    function wantedCount() {
      return state.items.filter(function (it) { return it.wanted; }).length;
    }

    function updateBadge() {
      var n = wantedCount();
      shopBadge.textContent = String(n);
      shopBadge.classList.toggle("hidden", n === 0);
    }

    function itemsOf(catId) {
      return state.items
        .filter(function (it) { return it.cat === catId; })
        .sort(function (a, b) { return a.name.localeCompare(b.name, "zh-Hant"); });
    }

    function shoppingItems() {
      return state.items
        .filter(function (it) { return it.wanted; })
        .sort(function (a, b) { return a.name.localeCompare(b.name, "zh-Hant"); });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function itemCardHtml(it, showCat) {
      var on = !!it.wanted;
      return (
        '<article class="item-card">' +
          '<button class="star-btn' + (on ? " on" : "") + '" data-star="' + it.id + '" aria-label="' + (on ? "移出待購清單" : "加入待購清單") + '">' +
            (on ? STAR_ON : STAR_OUT) +
          "</button>" +
          '<div class="item-head">' +
            '<button class="item-name" data-edit="' + it.id + '">' + escapeHtml(it.name) + "</button>" +
          "</div>" +
          '<div class="item-mid">' +
            '<div class="qty-num' + (it.qty <= 0 ? " bad" : "") + '">' + it.qty + "</div>" +
            (showCat ? '<span class="item-sub">' + escapeHtml(CATEGORIES[it.cat] || "") + "</span>" : "") +
          "</div>" +
          '<div class="qty-row">' +
            '<button class="qty-btn" data-delta="-1" data-id="' + it.id + '">−</button>' +
            '<button class="qty-btn plus" data-delta="1" data-id="' + it.id + '">+</button>' +
          "</div>" +
        "</article>"
      );
    }

    function showHome() {
      currentCat = null;
      shoppingMode = false;
      homeView.classList.remove("hidden");
      listView.classList.add("hidden");
      backBtn.classList.add("hidden");
      addBtn.classList.add("hidden");
      shopBtn.classList.remove("hidden");
      pageTitle.textContent = "家居庫存";
      eyebrow.textContent = "六大種類";
      updateBadge();
    }

    function renderList() {
      var list = shoppingMode ? shoppingItems() : itemsOf(currentCat);
      emptyHint.classList.toggle("hidden", list.length > 0);
      emptyHint.innerHTML = shoppingMode
        ? "未有待購用品。<br/>喺用品方格右上角撳星星加入。"
        : "呢個分類暫時未有用品。<br/>撳右下角加一個大方格。";
      itemList.innerHTML = list.map(function (it) {
        return itemCardHtml(it, shoppingMode);
      }).join("");
      updateBadge();
    }

    function openCat(catId) {
      currentCat = catId;
      shoppingMode = false;
      homeView.classList.add("hidden");
      listView.classList.remove("hidden");
      backBtn.classList.remove("hidden");
      addBtn.classList.remove("hidden");
      shopBtn.classList.remove("hidden");
      pageTitle.textContent = CATEGORIES[catId] || catId;
      eyebrow.textContent = "細分類";
      renderList();
    }

    function openShop() {
      currentCat = null;
      shoppingMode = true;
      homeView.classList.add("hidden");
      listView.classList.remove("hidden");
      backBtn.classList.remove("hidden");
      addBtn.classList.add("hidden");
      shopBtn.classList.add("hidden");
      pageTitle.textContent = "待購清單";
      eyebrow.textContent = "已加星用品";
      renderList();
    }

    function changeQty(id, delta) {
      var it = state.items.filter(function (x) { return x.id === id; })[0];
      if (!it) return;
      it.qty = Math.max(0, Number(it.qty) + delta);
      saveState();
      renderList();
    }

    function toggleWanted(id) {
      var it = state.items.filter(function (x) { return x.id === id; })[0];
      if (!it) return;
      it.wanted = !it.wanted;
      saveState();
      renderList();
    }

    function openModal(item) {
      editingId = item ? item.id : null;
      modalTitle.textContent = item ? "編輯用品" : "新增用品";
      itemName.value = item ? item.name : "";
      itemQty.value = item ? item.qty : 1;
      itemCat.value = item ? item.cat : (currentCat || "food");
      deleteBtn.classList.toggle("hidden", !item);
      modal.classList.remove("hidden");
    }

    function closeModal() {
      modal.classList.add("hidden");
      editingId = null;
    }

    document.getElementById("catGrid").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-cat]");
      if (btn) openCat(btn.getAttribute("data-cat"));
    });

    itemList.addEventListener("click", function (e) {
      var star = e.target.closest("[data-star]");
      if (star) {
        toggleWanted(star.getAttribute("data-star"));
        return;
      }
      var edit = e.target.closest("[data-edit]");
      if (edit) {
        var item = state.items.filter(function (x) { return x.id === edit.getAttribute("data-edit"); })[0];
        openModal(item);
        return;
      }
      var btn = e.target.closest("[data-delta]");
      if (btn) changeQty(btn.getAttribute("data-id"), Number(btn.getAttribute("data-delta")));
    });

    backBtn.addEventListener("click", showHome);
    shopBtn.addEventListener("click", openShop);
    addBtn.addEventListener("click", function () { openModal(null); });
    cancelBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var payload = {
        name: itemName.value.trim(),
        cat: itemCat.value,
        qty: Math.max(0, Number(itemQty.value) || 0)
      };
      if (!payload.name) return;
      if (editingId) {
        var it = state.items.filter(function (x) { return x.id === editingId; })[0];
        if (it) {
          it.name = payload.name;
          it.cat = payload.cat;
          it.qty = payload.qty;
        }
      } else {
        payload.id = uid();
        payload.wanted = false;
        state.items.push(payload);
      }
      saveState();
      closeModal();
      if (shoppingMode) renderList();
      else if (!currentCat) openCat(payload.cat);
      else renderList();
    });

    deleteBtn.addEventListener("click", function () {
      if (!editingId) return;
      if (!confirm("確定刪除呢件用品？")) return;
      state.items = state.items.filter(function (x) { return x.id !== editingId; });
      saveState();
      closeModal();
      renderList();
    });

    updateBadge();
  </script>
</body>
</html>
